name: Refresh calendar

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages production build
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Add CLOUDFLARE_DEPLOY_HOOK_URL as a repository Actions secret."
            exit 1
          fi
          curl --fail --show-error --silent --request POST "$DEPLOY_HOOK_URL"
